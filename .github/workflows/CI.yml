name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
      - "drafts/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
      - "drafts/**"
  workflow_dispatch:  # allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1"            # latest stable Julia 1.x
          - "lts"          # long-term support release
          - "nightly"      # latest nightly (allowed to fail)
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        exclude:
          # reduce matrix size: nightly only tested on ubuntu
          - version: "nightly"
            os: windows-latest
          - version: "nightly"
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "${{ matrix.version }}"
          arch: x64

      - name: Cache artifacts
        uses: julia-actions/cache@v2

      - name: Build package
        uses: julia-actions/julia-buildpkg@v1

      - name: Run tests
        id: test
        uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: 4

      - name: Process coverage
        uses: julia-actions/julia-processcoverage@v1

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info

      - name: Run doctests (if any)
        if: always() && steps.test.outcome == 'success'
        run: |
          julia --project -e 'using KernelArrays; @info "Package loaded successfully"'
